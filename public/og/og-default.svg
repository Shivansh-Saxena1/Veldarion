<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="630" viewBox="0 0 1200 630">
  <!-- Background -->
  <rect width="1200" height="630" fill="#F4EFE4"/>
  
  <!-- Subtle paper texture pattern -->
  <defs>
    <pattern id="paperTexture" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1" fill="#14110C" opacity="0.04"/>
    </pattern>
    <pattern id="diagonalStripe" width="40" height="40" patternUnits="userSpaceOnUse">
      <rect x="0" y="0" width="40" height="40" fill="#E8A317" opacity="0.15" transform="rotate(-15 20 20)"/>
    </pattern>
  </defs>
  <rect width="1200" height="630" fill="url(#paperTexture)"/>
  
  <!-- Decorative diagonal amber stripe -->
  <rect x="-200" y="0" width="600" height="630" fill="#E8A317" opacity="0.1" transform="rotate(-15, 100, 315)"/>
  
  <!-- Main content area -->
  <g transform="translate(100, 140)">
    <!-- Veldarion Logo -->
    <g transform="translate(0, 0)">
      <!-- V Mark -->
      <rect x="0" y="0" width="88" height="96.8" rx="13.2" fill="#14110C"/>
      <path d="M15.4 30.8 L44 74.8 L72.6 30.8 L61.6 30.8 L44 57.2 L26.4 30.8 Z" fill="#C5F23D"/>
      <path d="M44 8.8 L59.4 30.8 L28.6 30.8 Z" fill="#C5F23D"/>
      <!-- Wordmark -->
      <text x="110" y="70" font-family="Georgia, serif" font-size="48" font-weight="bold" fill="#14110C" letter-spacing="-0.5">Veldarion</text>
    </g>
    
    <!-- Tagline -->
    <text x="0" y="150" font-family="Georgia, serif" font-size="32" font-weight="bold" fill="#14110C" style="white-space: pre;">
AI-Assisted Medical Claim Denial Analysis & Appeal Preparation
    </text>
    
    <!-- Description -->
    <text x="0" y="230" font-family="Georgia, serif" font-size="22" fill="#2A2620" style="white-space: pre;">
Veldarion helps specialty practices analyze denied claims, find payer-policy evidence, 
and prepare fully cited appeals — with human expert review. Success-based pricing.
    </text>
    
    <!-- CTA indicator -->
    <g transform="translate(0, 340)">
      <rect x="0" y="0" width="320" height="64" rx="32" fill="#C5F23D"/>
      <text x="160" y="42" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#14110C" text-anchor="middle">
Submit a denied claim for review →
      </text>
    </g>
  </g>
  
  <!-- Footer line -->
  <line x1="100" y1="520" x2="1100" y2="520" stroke="#14110C" stroke-width="1" opacity="0.15"/>
  
  <!-- Bottom info -->
  <text x="600" y="555" font-family="Georgia, serif" font-size="16" fill="#8A8170" text-anchor="middle">
    veldarion.com  •  shivansh@veldarion.com  •  © 2026 Veldarion
  </text>
  
  <!-- Chartreuse accent diamond -->
  <polygon points="595,570 600,580 605,570 600,560" fill="#A8D11C"/>
</svg>